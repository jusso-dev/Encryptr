services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-encryptr}
      # Override in production via .env; the default is for local dev only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encryptr}
      POSTGRES_DB: ${POSTGRES_DB:-encryptr}
    ports:
      # Bind to loopback so the database is not exposed on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encryptr"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-encryptr}:${POSTGRES_PASSWORD:-encryptr}@postgres:5432/${POSTGRES_DB:-encryptr}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PROVIDER: ${PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
