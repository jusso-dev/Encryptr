name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate OpenAPI spec
        run: cargo run --locked --bin gen-openapi
      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code -- docs/openapi.yaml docs/openapi.json; then
            echo "::error::docs/openapi.{yaml,json} is out of date. Run 'cargo run --bin gen-openapi' and commit the result." >&2
            exit 1
          fi
      - name: Validate spec with Redocly
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: |
            docs/openapi.yaml
            docs/openapi.json

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: encryptr
          POSTGRES_PASSWORD: encryptr
          POSTGRES_DB: encryptr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encryptr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (unit, property, integration)
        run: cargo test --all-targets
        env:
          TEST_DATABASE_URL: postgres://encryptr:encryptr@localhost:5432/encryptr_test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # sqlx-postgres transitively uses rsa 0.9.10. RUSTSEC-2023-0071 has
        # no fixed release; remove this narrow exception when SQLx can upgrade.
        run: cargo audit --ignore RUSTSEC-2023-0071

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: encryptr-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release artifact
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: encryptr-server-linux-x86_64
          path: target/release/encryptr-server
